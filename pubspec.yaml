name: geomeasure
description: "GeoMeasure - Capability-Aware Spatial & Land Measurement Engine"
publish_to: 'none'

version: 2.3.0+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  vector_math: ^2.1.4
  path_provider: ^2.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.3.3
  intl: ^0.19.0
  share_plus: ^10.0.0
  google_fonts: ^6.1.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.0
  image_picker: ^1.1.2
  pdf: ^3.11.2
  printing: ^5.13.5
  # Google ML Kit — on-device vision (Android/iOS only)
  # Uncomment when building for mobile targets:
  # google_mlkit_object_detection: ^0.14.0
  # google_mlkit_image_labeling: ^0.14.0
  # google_mlkit_barcode_scanning: ^0.14.0
  # google_mlkit_text_recognition: ^0.15.0
  # google_mlkit_commons: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
