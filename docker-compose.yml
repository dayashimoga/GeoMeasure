# GeoMeasure Docker Compose — CI/CD and Local Development
# All services share the same Dockerfile for cache efficiency.

services:
  # ── Quality Gates ──
  app-test:
    build: .
    command: flutter test --coverage
    volumes:
      - .:/app

  app-analyze:
    build: .
    command: flutter analyze
    volumes:
      - .:/app

  app-format:
    build: .
    command: dart format --set-exit-if-changed .
    volumes:
      - .:/app

  # ── Build Targets ──
  app-build-web:
    build: .
    command: flutter build web --release
    volumes:
      - .:/app

  app-build-apk:
    build: .
    command: flutter build apk --debug
    volumes:
      - .:/app

  app-build-apk-release:
    build: .
    command: flutter build apk --release
    volumes:
      - .:/app

  app-build-aab:
    build: .
    command: flutter build appbundle --release
    volumes:
      - .:/app

  # ── Full CI Pipeline ──
  app-ci:
    build: .
    command: >
      sh -c "
        flutter analyze &&
        dart format --set-exit-if-changed . &&
        flutter test --coverage &&
        flutter build web --release &&
        flutter build apk --debug &&
        echo '✅ CI pipeline complete'
      "
    volumes:
      - .:/app
